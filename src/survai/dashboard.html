<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Surveillance.ai</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1019;
      --panel: #111927;
      --line: #283548;
      --ink: #f0f4fb;
      --muted: #a6b3c8;
      --mint: #81f4c1;
      --amber: #ffc781;
      --red: #ff9eae;
      --mono: 'IBM Plex Mono', ui-monospace, monospace;
    }
    * { box-sizing: border-box }
    [hidden] { display: none !important }
    body {
      margin: 0;
      background: radial-gradient(ellipse at 24% 0%, #1b293e, transparent 58%), var(--bg);
      color: var(--ink);
      font: 15px 'Geist', system-ui, sans-serif;
      min-height: 100vh;
    }
    main { max-width: 1560px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 64px) 48px }
    h1, h2, p { margin: 0 }
    .topbar {
      min-height: 94px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
    }
    .session-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap }
    .session-controls[hidden] { display: none }
    .session-controls button { font: inherit; font-size: 13px; color: var(--text); background: var(--panel);
      border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px; cursor: pointer }
    .session-controls button:disabled { opacity: .55; cursor: default }
    #session-message { margin-top: 12px; color: #ffacb4 }
    #camera-placeholder { color: var(--muted); padding: 22px 12px }
    .brand { display: flex; align-items: center; gap: 12px }
    .brand-mark {
      width: 39px;
      height: 39px;
      display: grid;
      place-items: center;
      border: 1px solid #3a7668;
      border-radius: 11px;
      background: #142e31;
    }
    .brand-mark::before {
      content: '';
      width: 14px;
      height: 14px;
      border: 2px solid var(--mint);
      border-radius: 50%;
      box-shadow: 0 0 12px #81f4c14a, inset 0 0 8px #81f4c14a;
    }
    h1 { font-size: clamp(20px, 3vw, 26px); letter-spacing: -.05em }
    h2 { font-size: 16px; font-weight: 650 }
    a { color: var(--mint); text-underline-offset: 4px }
    :focus-visible { outline: 2px solid var(--mint); outline-offset: 3px }
    #status, #camera-status, time { font: 12px var(--mono); font-variant-numeric: tabular-nums }
    #status {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--muted);
    }
    #status[hidden], #mark-paid[hidden], #history-panel[hidden] { display: none }
    #status.clear { color: var(--mint); border-color: #2e5e53 }
    #status.alert { color: var(--red); border-color: #8c4352; background: #38212d }
    #status.clear::before, #status.alert::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 9px currentColor;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(310px, 1fr);
      gap: 18px;
      margin-top: 26px;
      align-items: start;
    }
    .panel {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--panel);
      overflow: hidden;
      box-shadow: 0 14px 32px #02050b55;
    }
    .panel-head {
      min-height: 59px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
    }
    #door-counts { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 0; padding: 12px 18px; color: var(--muted) }
    #door-counts[hidden], #door-activity[hidden] { display: none }
    #door-activity { list-style: none; margin: 0; padding: 0 18px; max-height: 130px; overflow: auto }
    #door-activity li { padding: 8px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere;
      font: 12px/1.55 var(--mono); color: var(--muted) }
    #door-activity li:first-child { color: var(--text) }
    #door-counts strong { color: var(--mint); margin-left: 6px }
    #camera-status, time { color: var(--muted) }
    .viewport { padding: 10px; background: #0c131f }
    .camera-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
    .camera-grid.single { grid-template-columns: 1fr }
    .layout.people-only { grid-template-columns: minmax(0, 1fr) }
    .camera-grid figure { margin: 0 }
    .camera-grid figcaption { color: var(--muted); font: 12px var(--mono); padding: 8px 2px }
    .camera-grid img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: contain; background: #070c14 }
    #floor-map { width: 100%; height: auto; display: block; background: #0b1220 }
    @media (max-width: 540px) { .camera-grid { grid-template-columns: 1fr } }
    #demo-canvas { width: 100%; height: auto; background: #070c14; border-radius: 8px; display: block }
    .demo-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 4px 4px }
    .demo-actions button { padding: 8px 12px; color: var(--mint); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; cursor: pointer }
    .demo-actions button:disabled { opacity: .45; cursor: default }
    #feed {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: contain;
      background: #070c14;
      border: 1px solid #28394d;
      border-radius: 8px;
    }
    .history-body { padding: 13px }
    .visits-panel { grid-column: 1 / -1 }
    #visits { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 10px }
    #visits strong { color: var(--mint) }
    #visits .out-of-view { opacity: .5 }
    #visits-empty { color: var(--muted); padding: 10px }
    #empty { padding: 18px 12px; color: var(--muted) }
    #error { margin: 0 0 10px; color: var(--red); font-size: 13px }
    #alerts { display: grid; gap: 10px; max-height: 68vh; overflow: auto; padding: 2px }
    article {
      display: grid;
      gap: 11px;
      padding: 13px;
      background: #151f2f;
      border: 1px solid #304058;
      border-radius: 9px;
    }
    article.warning { border-left: 3px solid var(--amber) }
    .card-top, .actions { display: flex; align-items: center; justify-content: space-between; gap: 10px }
    .card-top strong { font-size: 14px; color: var(--amber) }
    article img { display: block; width: 100%; aspect-ratio: 16 / 8; object-fit: contain; border-radius: 6px; background: #070c14 }
    article p { line-height: 1.5; color: var(--muted); font-size: 13px }
    .clip { min-width: 0; color: var(--muted); font-size: 12px }
    .delete {
      cursor: pointer;
      padding: 5px 9px;
      border: 1px solid #684653;
      border-radius: 6px;
      color: #ffb0bd;
      background: transparent;
      font: inherit;
      font-size: 12px;
    }
    .delete:hover { background: #482a37 }
    .delete:disabled { opacity: .55; cursor: wait }
    @media (max-width: 795px) {
      .layout { grid-template-columns: 1fr }
      #alerts { max-height: none }
    }
  </style>
</head>
<body><main>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><h1>Surveillance.ai</h1></div>
    <nav class="session-controls" id="session-controls" aria-label="Camera controls" hidden>
      <a href="/setup">Camera setup</a>
      <button id="mark-paid" type="button" disabled>Mark dining guests paid</button>
      <button id="stop-cameras" type="button" disabled>Stop cameras</button>
    </nav>
    <p id="status" class="clear" role="status">0 alerts</p>
  </header>
  <p id="session-message" role="status" hidden></p>
  <div class="layout">
    <section class="panel" aria-labelledby="camera-heading">
      <div class="panel-head"><h2 id="camera-heading">Camera feed</h2><span id="camera-status">Connecting</span></div>
      <p id="door-counts" role="status" hidden>
        <span>In store <strong id="in-store">0</strong></span>
        <span>Came in <strong id="came-in">0</strong></span>
        <span>Left <strong id="left-count">0</strong></span>
        <span>Employees <strong id="employee-count">0</strong></span>
      </p>
      <ol id="door-activity" aria-label="Recent doorway activity, newest first" hidden></ol>
      <div class="viewport"><img id="feed" alt="Annotated camera feed"></div>
    </section>
    <section class="panel" id="history-panel" aria-labelledby="history-heading">
      <div class="panel-head"><h2 id="history-heading">Alert history</h2></div>
      <div class="history-body">
        <p id="error" role="alert" hidden></p>
        <p id="empty">No alerts yet.</p>
        <div id="alerts" aria-live="polite"></div>
      </div>
    </section>
    <section class="panel visits-panel" aria-labelledby="visits-heading">
      <div class="panel-head"><h2 id="visits-heading">Guests in view</h2><span id="guest-count" hidden></span></div>
      <div class="history-body">
        <p id="visits-empty">No guests in view.</p>
        <div id="visits"></div>
      </div>
    </section>
    <section id="floor-panel" class="panel visits-panel" hidden>
      <div class="panel-head"><h2>Shared floor map</h2><p id="room-count" role="status"></p></div>
      <canvas id="floor-map" width="720" height="380" aria-label="Guest positions and movement trails"></canvas>
    </section>
  </div>
</main><!-- Hosted demo script --><script>
  const alerts = document.querySelector('#alerts');
  const status = document.querySelector('#status');
  const cameraStatus = document.querySelector('#camera-status');
  const empty = document.querySelector('#empty');
  const error = document.querySelector('#error');
  const visits = document.querySelector('#visits');
  let lastVisitCards = '';
  function renderVisits(profiles, includeHidden = false, peopleOnly = false) {
    const cards = profiles.filter(profile => includeHidden || profile.visible).map(profile => [
      profile.track_id, profile.state, profile.first_seen, profile.cameras || [], profile.visible,
      profile.dwell_seconds == null ? null : Math.floor(profile.dwell_seconds), profile.employee, peopleOnly,
    ]);
    const signature = JSON.stringify(cards);
    if (signature === lastVisitCards) return;
    lastVisitCards = signature;
    document.querySelector('#visits-empty').hidden = cards.length > 0;
    visits.replaceChildren(...cards.map(([id, state, firstSeen, cameras, visible, dwell, employee, peopleOnly]) => {
      const card = document.createElement('article');
      if (!visible) card.className = 'out-of-view';
      const title = document.createElement('strong');
      title.textContent = `${employee ? "Employee" : peopleOnly ? "Customer" : "Guest"} #${id}`;
      const status = document.createElement('p');
      status.textContent = state;
      const time = document.createElement('p');
      time.textContent = `First seen ${new Date(firstSeen).toLocaleTimeString()}`;
      card.append(title);
      if (!peopleOnly) card.append(status);
      card.append(time);
      if (!peopleOnly && (includeHidden || cameras.length)) {
        const details = document.createElement('p');
        details.textContent = visible
          ? [...cameras.map(camera => camera.toUpperCase()), `${dwell}s dining`].join(' · ')
          : 'Out of view';
        if (cameras.length === 1) {
          details.textContent += ' · ●';
          details.title = 'Visible on one camera';
        }
        card.append(details);
      }
      return card;
    }));
  }
  const displayAlert = event => {
    empty.hidden = true;
    const existing = document.getElementById(`alert-${event.id}`);
    if (existing) {
      if (!event.snapshot_path) existing.querySelector('img')?.remove();
      showClip(existing.querySelector('.clip'), event);
      return;
    }
    const card = document.createElement('article');
    card.id = `alert-${event.id}`;
    card.className = event.severity;
    const heading = document.createElement('div');
    heading.className = 'card-top';
    const title = document.createElement('strong');
    title.textContent = event.type === 'possible_walkout' ? 'Possible walk-out' : event.type.replaceAll('_', ' ');
    const time = document.createElement('time');
    time.dateTime = event.timestamp;
    time.textContent = new Date(event.timestamp).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    heading.append(title, time);
    card.append(heading);
    if (event.snapshot_path) {
      const image = document.createElement('img');
      image.src = event.snapshot_path;
      image.alt = 'Guest before the unpaid exit';
      image.onerror = () => image.remove();
      card.append(image);
    }
    const description = document.createElement('p');
    description.textContent = event.message;
    const actions = document.createElement('div');
    actions.className = 'actions';
    const clip = document.createElement('div');
    clip.className = 'clip';
    showClip(clip, event);
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'delete';
    button.textContent = 'Delete';
    button.setAttribute('aria-label', 'Delete alert');
    button.onclick = () => deleteAlert(event.id, button);
    actions.append(clip, button);
    card.append(description, actions);
    alerts.prepend(card);
    if (alerts.childElementCount > 100) alerts.lastElementChild.remove();
  };

  function removeAlert(id) {
    document.getElementById(`alert-${id}`)?.remove();
    empty.hidden = alerts.childElementCount > 0;
  }

  async function deleteAlert(id, button) {
    if (window.startHostedDemo) {
      deleteHostedAlert(id);
      return;
    }
    button.disabled = true;
    error.hidden = true;
    try {
      const response = await fetch(`/api/alerts/${encodeURIComponent(id)}`, { method: 'DELETE' });
      if (!response.ok) throw new Error('Delete request failed');
      removeAlert(id);
      await refresh();
    } catch {
      error.textContent = 'Could not delete this alert. Try again.';
      error.hidden = false;
      button.disabled = false;
    }
  }

  function showClip(container, event) {
    container.replaceChildren();
    if (event.clip_status === 'ready' && event.clip_path) {
      const link = document.createElement('a');
      link.href = event.clip_path;
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = 'Play evidence clip';
      container.append(link);
    } else if (event.clip_status) {
      const labels = { pending: 'Preparing clip…', expired: 'Clip expired', unavailable: 'Clip unavailable' };
      container.textContent = labels[event.clip_status];
    }
  }
  const viewport = document.querySelector('.viewport');
  const sessionControls = document.querySelector('#session-controls');
  const markPaid = document.querySelector('#mark-paid');
  const stopCameras = document.querySelector('#stop-cameras');
  const sessionMessage = document.querySelector('#session-message');
  let webMode = false;
  let sessionMode = '';
  let cameraKey = '';
  let sending = false;
  function showSessionMessage(text) {
    sessionMessage.hidden = !text;
    sessionMessage.textContent = text;
  }
  async function cameraAction(action) {
    sending = markPaid.disabled = stopCameras.disabled = true;
    showSessionMessage('');
    try {
      const response = await fetch(`/api/session/${action}`, { method: 'POST' });
      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        throw new Error(body.detail || 'Camera command failed.');
      }
    } catch (error) {
      showSessionMessage(error.message);
    } finally {
      sending = false;
      await refresh();
    }
  }
  markPaid.onclick = () => cameraAction('pay');
  stopCameras.onclick = () => cameraAction('stop');
  let lastDoorActivity = '';
  const doorTime = new Intl.DateTimeFormat('en-US', {
    hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true,
  });
  function renderDoorway(counts, activity = []) {
    document.querySelector('#door-counts').hidden = !counts;
    if (counts) {
      for (const [id, key] of [
        ['in-store', 'in_store'], ['came-in', 'came_in'], ['left-count', 'left'], ['employee-count', 'employees'],
      ]) {
        const value = String(counts[key] ?? 0);
        const field = document.getElementById(id);
        if (field.textContent !== value) field.textContent = value;
      }
    }
    const list = document.querySelector('#door-activity');
    list.hidden = !counts || !activity.length;
    const signature = JSON.stringify(activity);
    if (signature === lastDoorActivity) return;
    lastDoorActivity = signature;
    list.replaceChildren(...activity.map(record => {
      const { crossing, timestamp, employee, in_store, employees } = record;
      const row = document.createElement('li');
      const time = doorTime.format(new Date(timestamp));
      const role = employee ? 'EMPLOYEE' : 'CUSTOMER';
      row.textContent = `[${time}] ${role} #${crossing.track_id} ${crossing.direction} | In store: ${in_store} | Came in: ${crossing.came_in} | Left: ${crossing.left} | Employees: ${employees}`;
      return row;
    }));
  }
  const refresh = async () => {
    try {
      const response = await fetch('/api/status', { cache: 'no-store' });
      if (!response.ok) throw new Error('Status request failed');
      const current = await response.json();
      const peopleOnly = current.walkout_enabled === false;
      document.querySelector('.layout').classList.toggle('people-only', peopleOnly);
      document.querySelector('#history-panel').hidden = peopleOnly;
      status.hidden = peopleOnly;
      markPaid.hidden = peopleOnly;
      const guestCount = document.querySelector('#guest-count');
      guestCount.hidden = !peopleOnly;
      const countText = `${current.customers_in_view} ${current.customers_in_view === 1 ? 'guest' : 'guests'}`;
      if (guestCount.textContent !== countText) guestCount.textContent = countText;
      document.querySelector('#visits-heading').textContent = peopleOnly ? 'People in view' : 'Guests in view';
      document.querySelector('#visits-empty').textContent = peopleOnly ? 'No people in view.' : 'No guests in view.';
      renderDoorway(current.door_counts, current.door_activity);
      const count = current.total_alerts;
      const label = `${count} ${count === 1 ? 'alert' : 'alerts'}`;
      if (status.textContent !== label) status.textContent = label;
      status.className = count && current.alert_active ? 'alert' : 'clear';
      cameraStatus.textContent = current.status === 'Monitoring' ? 'Live' : current.status;
      const visitsResponse = await fetch('/api/visits', { cache: 'no-store' });
      const floorResponse = await fetch('/api/floor', { cache: 'no-store' });
      const floor = floorResponse.ok ? await floorResponse.json() : null;
      if (visitsResponse.ok) renderVisits(await visitsResponse.json(), floor !== null, peopleOnly);
      if (floor !== null) renderFloor(floor);
      else document.querySelector('#floor-panel').hidden = true;
      const cameraResponse = await fetch('/api/cameras', { cache: 'no-store' });
      if (webMode) {
        const sessionResponse = await fetch('/api/session', { cache: 'no-store' });
        if (sessionResponse.ok) {
          const session = await sessionResponse.json();
          sessionMode = session.mode;
          markPaid.disabled = sending || session.mode !== 'monitoring' || current.status !== 'Monitoring';
          stopCameras.disabled = sending || !['preview', 'monitoring'].includes(session.mode);
          if (session.error) showSessionMessage(session.error);
        }
      }
      if (cameraResponse.ok) renderCameras(await cameraResponse.json());
    } catch {
      status.textContent = 'Dashboard disconnected';
      status.className = '';
      cameraStatus.textContent = 'Offline';
      renderVisits([]);
    }
  };
  function renderFloor(floor) {
    document.querySelector('#floor-panel').hidden = false;
    const count = document.querySelector('#room-count');
    count.textContent = `Guests in room: ${floor.guests.filter(guest => guest.present).length}`;
    const canvas = document.querySelector('#floor-map');
    const context = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;
    context.clearRect(0, 0, width, height);
    const point = ([x, y]) => [
      45 + Math.max(-0.05, Math.min(1.05, x)) * (width - 90),
      30 + Math.max(-0.05, Math.min(1.05, y)) * (height - 60),
    ];
    context.strokeStyle = '#29394e';
    for (let i = 0; i <= 10; i++) {
      const q = i / 10;
      context.beginPath();
      context.moveTo(...point([q, 0]));
      context.lineTo(...point([q, 1]));
      context.moveTo(...point([0, q]));
      context.lineTo(...point([1, q]));
      context.stroke();
    }
    const palette = ['#90d3ff', '#81f4c1', '#dba2f8', '#ffcf9b', '#aed0f9'];
    context.font = '15px monospace';
    Object.values(floor.coverage).forEach((camera, index) => {
      context.strokeStyle = context.fillStyle = palette[index % palette.length];
      context.globalAlpha = 0.42;
      context.setLineDash([5, 6]);
      context.beginPath();
      camera.outline.forEach((position, i) => {
        if (i) context.lineTo(...point(position));
        else context.moveTo(...point(position));
      });
      context.closePath();
      context.stroke();
      context.setLineDash([]);
      context.fillText(camera.name, 45 + index * 155, height - 7);
    });
    for (const guest of floor.guests) {
      context.strokeStyle = context.fillStyle = palette[(guest.id - 1) % palette.length];
      guest.trail.slice(1).forEach((position, index) => {
        context.globalAlpha = 0.6 * (index + 1) / guest.trail.length;
        context.beginPath();
        context.moveTo(...point(guest.trail[index]));
        context.lineTo(...point(position));
        context.stroke();
      });
      context.globalAlpha = guest.visible ? 1 : 0.35;
      const [x, y] = point(guest.trail.at(-1));
      context.beginPath();
      context.arc(x, y, 6, 0, Math.PI * 2);
      context.fill();
      context.fillText(`Guest ${guest.id}`, x + 10, y - 8);
    }
    context.globalAlpha = 1;
  }
  function renderCameras(cameras) {
    if (!cameras.length) {
      if (webMode && (cameraKey || !document.querySelector('#camera-placeholder'))) {
        cameraKey = '';
        viewport.classList.remove('camera-grid');
        const placeholder = document.createElement('p');
        placeholder.id = 'camera-placeholder';
        viewport.replaceChildren(placeholder);
      }
      const placeholder = document.querySelector('#camera-placeholder');
      if (placeholder) placeholder.textContent = sessionMode === 'idle' ?
        'Open Camera setup to connect previews or start monitoring.' :
        sessionMode === 'preview' ? 'Camera previews are running in Camera setup.' : 'Waiting for camera feeds…';
      return;
    }
    const key = JSON.stringify(cameras.map(camera => camera.id));
    if (key !== cameraKey) {
      cameraKey = key;
      viewport.classList.add('camera-grid');
      viewport.classList.toggle('single', cameras.length === 1);
      viewport.replaceChildren(...cameras.map(camera => {
        const tile = document.createElement('figure');
        const caption = document.createElement('figcaption');
        caption.id = `camera-${camera.id}`;
        const image = document.createElement('img');
        image.src = `/video/${encodeURIComponent(camera.id)}`;
        image.alt = `${camera.name} feed`;
        tile.append(caption, image);
        return tile;
      }));
    }
    for (const camera of cameras) {
      document.getElementById(`camera-${camera.id}`).textContent =
        `${camera.name} · ${camera.status} · ${camera.fps.toFixed(1)} FPS`;
    }
  }
  if (window.startHostedDemo) {
    window.startHostedDemo({ renderVisits, displayAlert, removeAlert, status, cameraStatus });
  } else if (location.protocol === 'file:') {
    status.textContent = 'Start the demo with --dashboard, then ';
    const link = document.createElement('a');
    link.href = 'http://127.0.0.1:8765/';
    link.textContent = 'open the live dashboard';
    status.append(link);
    document.querySelector('.layout').hidden = true;
  } else {
    fetch('/api/session', { cache: 'no-store' }).then(response => {
      webMode = response.ok;
      sessionControls.hidden = !webMode;
      if (!webMode) {
        const feed = document.querySelector('#feed');
        if (feed) feed.src = '/video';
      }
      refresh();
    }).catch(refresh);
    const stream = new EventSource('/events');
    stream.onmessage = message => {
      const event = JSON.parse(message.data);
      displayAlert(event);
    };
    stream.addEventListener('alert-deleted', message => {
      removeAlert(message.data);
      refresh();
    });
    refresh();
    setInterval(refresh, 1000);
  }
</script></body>
</html>
